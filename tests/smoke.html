<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Re-Encoded Vocabulary smoke tests</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    code { font-family: ui-monospace, monospace; }
    #results { padding: 0; list-style: none; }
    #results li { padding: .45rem .65rem; border-left: 4px solid #888; margin: .4rem 0; }
    #results .pass { border-color: #218739; }
    #results .fail { border-color: #c0392b; }
    iframe { position: absolute; width: 1px; height: 1px; border: 0; opacity: 0; }
  </style>
</head>
<body>
  <h1>Re-Encoded Vocabulary smoke tests</h1>
  <p>These checks run against the local <code>index.html</code> without a build step.</p>
  <ul id="results"><li>Loading…</li></ul>
  <iframe id="app" title="Application under test" src="../index.html"></iframe>

  <script>
    const resultsEl = document.getElementById('results');
    const frame = document.getElementById('app');
    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    function report(name, passed, detail = '') {
      const li = document.createElement('li');
      li.className = passed ? 'pass' : 'fail';
      li.textContent = `${passed ? 'PASS' : 'FAIL'} — ${name}${detail ? `: ${detail}` : ''}`;
      resultsEl.appendChild(li);
      if(!passed) throw new Error(`${name}${detail ? `: ${detail}` : ''}`);
    }

    async function run() {
      resultsEl.innerHTML = '';
      const doc = frame.contentDocument;
      const win = frame.contentWindow;

      report('application renders the active subject', doc.querySelectorAll('#grid > .card').length === 150);
      report('empty subjects are not exposed', ![...doc.querySelectorAll('#subjectTabs button')].some(button => /School Subjects/.test(button.textContent)));

      const firstCard = doc.querySelector('#grid > .card');
      const firstInner = firstCard.querySelector('.card-inner');
      firstInner.focus();
      firstInner.dispatchEvent(new win.KeyboardEvent('keydown', {key: ' ', bubbles: true}));
      report('cards flip from the keyboard', firstCard.classList.contains('flipped') && firstInner.getAttribute('aria-pressed') === 'true');

      const exampleText = [...doc.querySelectorAll('.example')].map(example => example.textContent);
      report('HTML examples remain literal text', exampleText.some(text => text.includes('<form>')));
      report('examples cannot create HTML elements', !doc.querySelector('.example form, .example img, .example script'));
      report('lens controls expose visible labels', [...doc.querySelectorAll('#lensChips button')].every(button => button.textContent.trim().length > 0));
      const supabaseScript = [...doc.scripts].find(script => script.src.includes('supabase-js'));
      report('Supabase CDN is pinned and integrity checked', supabaseScript && /@2\.111\.0\//.test(supabaseScript.src) && supabaseScript.integrity.startsWith('sha384-') && supabaseScript.crossOrigin === 'anonymous');

      const search = doc.getElementById('search');
      search.value = 'this-term-does-not-exist';
      search.dispatchEvent(new win.Event('input', {bubbles: true}));
      await wait(250);
      doc.getElementById('studyToggle').click();
      report('Study Mode respects empty filters', !doc.getElementById('studyWrap').classList.contains('active'));
      doc.getElementById('quizToggle').click();
      report('Quiz Mode respects empty filters', !doc.getElementById('quizWrap').classList.contains('active'));

      search.value = '';
      search.dispatchEvent(new win.Event('input', {bubbles: true}));
      await wait(250);
      doc.getElementById('leaderboardBtnMain').click();
      const dialog = doc.querySelector('[role="dialog"]');
      report('leaderboard exposes dialog semantics', dialog && dialog.getAttribute('aria-modal') === 'true');
      const leaderboardList = doc.getElementById('leaderboardList');
      report('leaderboard loading/error state is announced', leaderboardList.getAttribute('aria-live') === 'polite' && leaderboardList.hasAttribute('aria-busy'));
      win.renderLeaderboardRows(leaderboardList, [
        {session_name: 'Same name', score: 20},
        {session_name: 'Same name', score: 10}
      ]);
      report('duplicate leaderboard names are disambiguated', /run 1/.test(leaderboardList.textContent) && /run 2/.test(leaderboardList.textContent));
      leaderboardList.textContent = 'Leaderboard unavailable offline; your score remains local.';
      report('leaderboard fallback state is visible', /unavailable offline/i.test(leaderboardList.textContent));
      dialog.dispatchEvent(new win.KeyboardEvent('keydown', {key: 'Escape', bubbles: true}));
      report('leaderboard closes with Escape', !doc.getElementById('leaderboardOverlay').classList.contains('active'));

      const failures = [...resultsEl.querySelectorAll('.fail')];
      if(!failures.length) document.title = 'PASS — Re-Encoded Vocabulary smoke tests';
    }

    frame.addEventListener('load', () => run().catch(error => {
      const li = document.createElement('li');
      li.className = 'fail';
      li.textContent = `FAIL — runner stopped: ${error.message}`;
      resultsEl.appendChild(li);
      document.title = 'FAIL — Re-Encoded Vocabulary smoke tests';
    }));
  </script>
</body>
</html>
